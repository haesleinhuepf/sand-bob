[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sand-bob"
version = "0.2.0"
description = "LLM-based code generation and docker-sandboxed execution in a loop in parallel"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Robert Haase", email = "robert.haase@uni-leipzig.de"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "docker>=6.0.0",
    "ipywidgets>=7.0.0",
    "ipython>=7.0.0",
    "jupytext>=1.0.0",
    "jupyterlab>=3.0.0",
    "matplotlib>=3.0.0",
    "numpy>=1.0.0",
    "openai>=1.0.0",
    "pandas>=1.0.0",
    "Pillow>=9.0.0",
    "scikit-image>=0.19.0",
    "wordcloud>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "requests>=2.0.0",
]

[project.urls]
Homepage = "https://haesleinhuepf.github.io/sand-bob/"
Repository = "https://github.com/haesleinhuepf/sand-bob"
Issues = "https://github.com/haesleinhuepf/sand-bob/issues"

[tool.setuptools.packages.find]
include = ["sand_bob*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config"
]

[tool.coverage.run]
source = ["sand_bob"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
] 